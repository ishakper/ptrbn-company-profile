[providers]
providers = ["php", "node"]

[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20"]

[phases.build]
cmds = [
  "cd frontend && npm install && npm run build",
  "cd backend && composer install --no-dev --optimize-autoloader"
]

[start]
cmd = "php backend/artisan migrate --force && php backend/artisan config:cache && php backend/artisan route:cache && php backend/artisan view:cache && php backend/artisan serve --host=0.0.0.0 --port=$PORT"
