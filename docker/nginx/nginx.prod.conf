user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off; # Hides version signatures
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org;" always;

    # HTTP to HTTPS Redirection
    server {
        listen 80;
        server_name rbn-group.com www.rbn-group.com;
        return 301 https://$host$request_uri;
    }

    # Production Server Configuration
    server {
        listen 443 ssl http2;
        server_name rbn-group.com www.rbn-group.com;

        # SSL Certificates Paths (Let's Encrypt mount)
        ssl_certificate /etc/letsencrypt/live/rbn-group.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rbn-group.com/privkey.pem;

        # Frontend Reverse Proxy
        location / {
            proxy_pass http://rbn-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend PHP-FPM API Routing (FastCGI proxy)
        location ~ ^/(api|sanctum) {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass rbn-backend:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }
}
